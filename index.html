    <style>
      html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
      #boot {
        position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; background: #05060a;
        color: rgba(233, 236, 245, 0.7); font: 300 11px/1.4 'Inter', system-ui, sans-serif;
        letter-spacing: 0.42em; text-transform: uppercase; transition: opacity 0.8s ease;
      }
      #boot.is-done { opacity: 0; pointer-events: none; }
      .boot__bar { position: relative; width: 180px; height: 1px; overflow: hidden; background: rgba(233, 236, 245, 0.14); }
      .boot__bar i {
        position: absolute; inset: 0; transform-origin: left;
        background: linear-gradient(90deg, rgba(255, 246, 225, 0.2), #ffd9a0);
        animation: boot-scan 1.4s ease-in-out infinite;
      }
      #boot.is-determinate .boot__bar i {
        animation: none; transform: scaleX(var(--p, 0)); transition: transform 0.5s ease;
      }
      .boot__label { font-size: 9.5px; letter-spacing: 0.2em; color: rgba(233, 236, 245, 0.38); text-transform: none; }
      @keyframes boot-scan { 0% { transform: translateX(-100%) scaleX(0.4); } 100% { transform: translateX(100%) scaleX(0.4); } }
    </style>
  </head>
  <body>
    <div id="boot" aria-live="polite">
      <div>Народження Всесвіту</div>
      <div class="boot__bar"><i></i></div>
      <div class="boot__label">Завантаження…</div>
    </div>
    <div id="root"></div>

  </body>
